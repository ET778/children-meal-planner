<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>童趣餐谱 · 儿童餐谱规划 V8</title><style>

:root{
  --color-primary:#E8A87C;--color-primary-hover:#D4946B;--color-primary-light:#FDF0EB;--color-primary-dark:#C98B6A;
  --color-secondary:#8FBC8F;--color-secondary-hover:#7AAE7A;--color-secondary-light:#EEFAED;
  --color-accent:#F5DEB3;--color-accent-light:#FEFAF0;
  --color-warm-red:#E07A5F;--color-warm-red-light:#F9E0D8;
  --color-lavender:#B8A9C9;--color-lavender-light:#F0EBF5;
  --color-bg:#FFF9F2;--color-surface:#FFFFFF;--color-surface-warm:#FFFAF5;--color-surface-hover:#FFF5ED;
  --color-text-primary:#4A3F35;--color-text-secondary:#7D7067;--color-text-tertiary:#A39585;
  --color-border:#F0E8DD;--color-border-strong:#E8DDD0;
  --shadow-xs:0 1px 2px rgba(74,63,53,0.05);--shadow-sm:0 2px 6px rgba(74,63,53,0.07);
  --shadow-md:0 4px 16px rgba(74,63,53,0.09);--shadow-lg:0 8px 32px rgba(74,63,53,0.12);
  --shadow-warm:0 4px 16px rgba(232,168,124,0.28);--shadow-warm-sm:0 2px 8px rgba(232,168,124,0.18);
  --grad-breakfast:linear-gradient(135deg,#FFF3CD,#FFE8B8);
  --grad-lunch:linear-gradient(135deg,#FFE4D4,#FFD4A8);
  --grad-dinner:linear-gradient(135deg,#E0F0E0,#D0E8CC);
  --grad-soup:linear-gradient(135deg,#EEE6FA,#E0D4F4);
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --font-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --dot1:rgba(232,168,124,0.07);--dot2:rgba(143,188,143,0.06);--header-bg:rgba(255,250,245,0.95);
}
/* ─── Per-Age-Group Color Themes ─── */
/* 0-6月：最柔和的粉奶色 */
[data-age="page-0-6"]{--color-primary:#E8B4B4;--color-primary-hover:#D49A9A;--color-primary-light:#FDEBEB;--color-secondary:#C4A4D4;--color-secondary-hover:#AA8ABE;--color-secondary-light:#F5EBFA;--color-bg:#FFF0F0;--color-surface-warm:#FFF5F5;--header-bg:rgba(255,240,240,0.95);--dot1:rgba(232,180,180,0.09);--dot2:rgba(196,164,212,0.07);--grad-breakfast:linear-gradient(135deg,#FFF0F0,#FFE0E0);--grad-lunch:linear-gradient(135deg,#FDF0EE,#FCE0D8);--grad-dinner:linear-gradient(135deg,#F0ECF5,#E8DFF0);--grad-soup:linear-gradient(135deg,#F0EDF5,#E5DDF2);}
/* 7-12月：柔和珊瑚暖橙（默认） */
[data-age="page-7-12"]{--color-primary:#E8A87C;--color-primary-hover:#D4946B;--color-primary-light:#FDF0EB;--color-bg:#FFF9F2;--color-surface-warm:#FFFAF5;--header-bg:rgba(255,250,245,0.95);--dot1:rgba(232,168,124,0.07);--dot2:rgba(143,188,143,0.06);}
/* 13-24月：温暖蜜桃橙 */
[data-age="page-13-24"]{--color-primary:#E89B6A;--color-primary-hover:#D48555;--color-primary-light:#FDF3EB;--color-bg:#FFF8EC;--color-surface-warm:#FFFBF0;--header-bg:rgba(255,248,236,0.95);--dot1:rgba(232,155,106,0.08);--dot2:rgba(155,196,160,0.07);--color-secondary:#9BC4A0;--color-secondary-hover:#80AE85;--color-secondary-light:#EEFBF0;--grad-breakfast:linear-gradient(135deg,#FFF5DC,#FFECC8);--grad-lunch:linear-gradient(135deg,#FFECD8,#FFDDB8);--grad-dinner:linear-gradient(135deg,#DEF0DC,#D4E8CC);--grad-soup:linear-gradient(135deg,#F0E6FA,#E2D4F4);}
/* 2-3岁：阳光金黄 */
[data-age="page-2-3"]{--color-primary:#E8BA5A;--color-primary-hover:#D4A040;--color-primary-light:#FEF8E8;--color-bg:#FFFBE5;--color-surface-warm:#FFFDF0;--header-bg:rgba(255,251,229,0.95);--dot1:rgba(232,186,90,0.08);--dot2:rgba(139,191,139,0.07);--color-secondary:#8BBF8B;--color-secondary-hover:#70A470;--color-secondary-light:#EDFAED;--grad-breakfast:linear-gradient(135deg,#FFF8D0,#FFECA8);--grad-lunch:linear-gradient(135deg,#FFECD0,#FFDCA8);--grad-dinner:linear-gradient(135deg,#D8F0D0,#C8E8BC);--grad-soup:linear-gradient(135deg,#E8DCF4,#D8C8EA);}
/* 4-6岁：清新薄荷绿 */
[data-age="page-4-6"]{--color-primary:#6BBF8F;--color-primary-hover:#58AA75;--color-primary-light:#E8FAF0;--color-bg:#F2FFF6;--color-surface-warm:#F8FFF8;--header-bg:rgba(242,255,246,0.95);--dot1:rgba(107,191,143,0.09);--dot2:rgba(232,168,124,0.06);--color-secondary:#E8A87C;--color-secondary-hover:#D4946B;--color-secondary-light:#FDF0EB;--grad-breakfast:linear-gradient(135deg,#E8FFE8,#D0F0D0);--grad-lunch:linear-gradient(135deg,#D8FFE0,#C0F0D0);--grad-dinner:linear-gradient(135deg,#FFE8D0,#FFD8B8);--grad-soup:linear-gradient(135deg,#E0D8F0,#D0C0E8);}
/* 6-10岁：活力天蓝 */
[data-age="page-6-10"]{--color-primary:#5BA8C8;--color-primary-hover:#4895B5;--color-primary-light:#E5F4FA;--color-bg:#EFF8FC;--color-surface-warm:#F0FAFC;--header-bg:rgba(239,248,252,0.95);--dot1:rgba(91,168,200,0.09);--dot2:rgba(232,168,124,0.06);--color-secondary:#E8A87C;--color-secondary-hover:#D4946B;--color-secondary-light:#FDF0EB;--grad-breakfast:linear-gradient(135deg,#D8EFF8,#B8E0F0);--grad-lunch:linear-gradient(135deg,#C8E8F8,#A8D8EF);--grad-dinner:linear-gradient(135deg,#FFF0E0,#FFE0D0);--grad-soup:linear-gradient(135deg,#DDD8F0,#CCC0E8);}
/* 11岁后：青春活力紫 */
[data-age="page-11-13"]{--color-primary:#9B7EC8;--color-primary-hover:#8865B0;--color-primary-light:#EDE8FA;--color-bg:#F5EEFA;--color-surface-warm:#F8F2FC;--header-bg:rgba(245,238,250,0.95);--dot1:rgba(155,126,200,0.09);--dot2:rgba(232,152,106,0.06);--color-secondary:#E8986A;--color-secondary-hover:#D48050;--color-secondary-light:#FCF0EB;--grad-breakfast:linear-gradient(135deg,#EEE4FA,#DED0F0);--grad-lunch:linear-gradient(135deg,#F8E4E8,#F0D0D8);--grad-dinner:linear-gradient(135deg,#E8F0E0,#D8E8CC);--grad-soup:linear-gradient(135deg,#F0E0F0,#E0D0E0);}

/* ─── Weekly Export Grid Layout (compact) ─── */
.export-weekly-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:12px;}
@media(min-width:800px){.export-weekly-grid{grid-template-columns:repeat(3,1fr);}}
.export-day-card{background:#fff;border:1.5px solid var(--color-border);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(74,63,53,0.05);overflow:hidden;}
.export-day-card .export-day-label{font-size:15px;font-weight:900;color:var(--color-primary);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--color-primary-light);padding-left:0;}
.export-day-card .export-meal-label{font-size:12px;padding:5px 12px;margin-bottom:6px;}
.export-day-card .export-dish-list{gap:5px;}
.export-day-card .export-dish{padding:5px 12px;font-size:12px;}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-body);color:var(--color-text-primary);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh;background:var(--color-bg);
  background-image:radial-gradient(circle,var(--dot1) 1.5px,transparent 1.5px),radial-gradient(circle,var(--dot2) 1px,transparent 1px);
  background-size:24px 24px,36px 36px;background-position:0 0,12px 12px;transition:background-color 0.4s ease;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
.container{max-width:1180px;margin:0 auto;padding:0 16px;}@media(min-width:1024px){.container{padding:0 24px;}}
.app-header{position:sticky;top:0;z-index:100;background:var(--header-bg);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--color-border);box-shadow:var(--shadow-sm);transition:background 0.4s ease;}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-logo{position:relative;width:52px;height:52px;border-radius:14px;background:linear-gradient(145deg,var(--color-primary),#F5C4A0,var(--color-primary));display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:var(--shadow-warm);flex-shrink:0;}
.brand-logo::before,.brand-logo::after{content:'';position:absolute;top:-8px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.65);animation:steamRise 2.2s ease-out infinite;}
.brand-logo::before{left:26%;animation-delay:0s;}.brand-logo::after{left:58%;animation-delay:1.1s;}
@keyframes steamRise{0%{transform:translateY(0) scale(0.5);opacity:0;}20%{opacity:0.75;}100%{transform:translateY(-22px) scale(2);opacity:0;}}
.brand-text h1{font-size:22px;font-weight:900;color:var(--color-text-primary);} .brand-text p{font-size:12px;color:var(--color-text-tertiary);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;font-weight:650;border-radius:14px;transition:all 0.25s ease;white-space:nowrap;padding:10px 18px;font-size:14px;}
.btn:active{transform:scale(0.96);}
.btn-primary{background:linear-gradient(135deg,var(--color-primary),#F0B890);color:#fff;box-shadow:var(--shadow-warm-sm);}
.btn-primary:hover{background:linear-gradient(135deg,var(--color-primary-hover),#E8A87C);box-shadow:var(--shadow-warm);}
.btn-secondary{background:var(--color-surface);color:var(--color-primary);border:2px solid var(--color-primary);padding:8px 16px;font-size:13px;}
.btn-secondary:hover{background:var(--color-primary-light);box-shadow:var(--shadow-warm-sm);}

.age-nav-wrap{background:linear-gradient(180deg,var(--color-surface),var(--color-surface-warm));border-bottom:1px solid var(--color-border);position:sticky;top:90px;z-index:90;}
.age-nav{display:flex;gap:4px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;max-width:1180px;margin:0 auto;}
.nav-item{flex:0 0 auto;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:700;color:var(--color-text-secondary);transition:all 0.25s ease;white-space:nowrap;border:1.5px solid transparent;}
.nav-item:hover:not(.active){background:var(--color-surface-hover);border-color:var(--color-border);}
.nav-item.active{background:linear-gradient(135deg,var(--color-primary),#F0B890);color:#fff;box-shadow:0 3px 12px rgba(232,168,124,0.35);}
@media(min-width:1024px){.age-nav{justify-content:center;padding:12px 24px;}}
/* ─── 粘性餐次快捷导航 ─── */
.meal-nav-wrap{background:var(--color-surface);border-bottom:1px solid var(--color-border);position:sticky;top:147px;z-index:85;display:none;}
.meal-nav-wrap.show{display:block;}
.meal-nav{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;scrollbar-width:none;max-width:1180px;margin:0 auto;}
.meal-nav-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--color-text-secondary);transition:all 0.2s ease;white-space:nowrap;border:1.5px solid transparent;cursor:pointer;}
.meal-nav-btn:hover:not(.active){background:var(--color-surface-hover);border-color:var(--color-border);}
.meal-nav-btn.active{color:#fff;box-shadow:0 2px 8px rgba(74,63,53,0.2);}
.meal-nav-btn.early.active{background:linear-gradient(135deg,#C8A800,#9B7D00);}
.meal-nav-btn.noon.active{background:linear-gradient(135deg,#E8986A,#C47844);}
.meal-nav-btn.night.active{background:linear-gradient(135deg,#6AA85A,#4A7C3A);}
.meal-nav-btn.soup.active{background:linear-gradient(135deg,#9B7EC8,#7B5E9E);}
.meal-nav-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:900;background:var(--color-primary-light);color:var(--color-primary);transition:all 0.2s ease;}
.meal-nav-btn.active .meal-nav-badge{background:rgba(255,255,255,0.3);color:#fff;}
@media(min-width:1024px){.meal-nav{justify-content:center;padding:8px 24px;}}
.age-page{display:none;animation:pageIn 0.35s ease;}.age-page.active{display:block;}
@keyframes pageIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}


/* ─── 备注标签功能 ─── */
.note-bar-wrap{text-align:center;margin-bottom:24px;}
.note-bar{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--color-surface-warm),var(--color-accent-light));border:2px dashed var(--color-border-strong);border-radius:16px;padding:10px 22px;transition:all 0.25s ease;max-width:420px;margin:0 auto;}
.note-bar:hover{border-color:var(--color-primary);background:linear-gradient(135deg,var(--color-primary-light),var(--color-accent-light));}
.note-label{font-size:13px;font-weight:700;color:var(--color-text-secondary);white-space:nowrap;display:flex;align-items:center;gap:5px;}
.note-label::before{content:'🏷️';font-size:14px;}
.note-input{flex:1;min-width:140px;border:1px solid var(--color-border);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:700;color:var(--color-primary);background:#fff;outline:none;text-align:center;transition:all 0.2s ease;font-family:inherit;}
.note-input:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(232,168,124,0.2);}.note-input::placeholder{color:var(--color-text-tertiary);font-weight:400;}
.note-badge{display:none;position:absolute;top:12px;right:16px;background:linear-gradient(135deg,var(--color-primary),#F0B890);color:#fff;font-size:12px;font-weight:800;padding:5px 14px;border-radius:999px;white-space:nowrap;z-index:10;box-shadow:var(--shadow-warm-sm);}
.export-mode .note-badge{display:block;}


.diet-section{padding:16px 0 24px;}
.diet-hero{text-align:center;margin-bottom:32px;}
.diet-hero-icon{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto 16px;display:block;box-shadow:var(--shadow-warm-sm);border:2px solid var(--color-primary-light);}
.diet-hero h2{font-size:28px;font-weight:900;color:var(--color-text-primary);}
.diet-hero p{font-size:14.5px;color:var(--color-text-secondary);max-width:560px;margin:0 auto;line-height:1.6;}
.diet-grid{display:grid;gap:16px;grid-template-columns:1fr;}@media(min-width:768px){.diet-grid{grid-template-columns:repeat(2,1fr);}}@media(min-width:1024px){.diet-grid{grid-template-columns:repeat(3,1fr);}}
.diet-card{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--color-surface),var(--color-surface-warm));border:1px solid var(--color-border);border-radius:20px;padding:20px;box-shadow:var(--shadow-sm);transition:all 0.25s ease;}
.diet-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
.diet-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));}
.diet-card-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.diet-card-icon{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:27px;flex-shrink:0;box-shadow:var(--shadow-xs);}
.diet-card-icon.warm{background:linear-gradient(145deg,var(--color-primary-light),#FFE8DC);}
.diet-card-icon.green{background:linear-gradient(145deg,var(--color-secondary-light),#E0F5E0);}
.diet-card-icon.yellow{background:linear-gradient(145deg,#FFF5DC,#FEF5E0);}
.diet-card-icon.purple{background:linear-gradient(145deg,var(--color-lavender-light),#EBE4F5);}
.diet-card-icon.milk{background:linear-gradient(145deg,#FFF9F0,#FFF5ED);border:1px solid var(--color-border);}
.diet-card h3{font-size:15.5px;font-weight:800;color:var(--color-text-primary);}
.diet-card ul{list-style:none;display:flex;flex-direction:column;gap:4px;}
.diet-card li{font-size:13.5px;color:var(--color-text-secondary);line-height:1.65;padding-left:20px;position:relative;}
.diet-card li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--color-primary);}
.diet-card.danger{border-color:var(--color-warm-red-light);background:linear-gradient(180deg,#FDF6F4,var(--color-surface));}
.diet-card.danger::before{background:linear-gradient(90deg,var(--color-warm-red),var(--color-primary));}
.diet-card.danger .diet-card-icon{background:linear-gradient(145deg,var(--color-warm-red-light),#FFECE6);}
.diet-card.danger li::before{background:var(--color-warm-red);}.diet-card.danger h3{color:var(--color-warm-red);}
.diet-card.tip{background:linear-gradient(180deg,var(--color-lavender-light),var(--color-surface));}
.diet-card.tip::before{background:linear-gradient(90deg,var(--color-lavender),var(--color-secondary));}
.diet-card.tip .diet-card-icon{background:linear-gradient(145deg,#fff,var(--color-lavender-light));}.diet-card.tip li::before{background:var(--color-lavender);}
.global-warning{margin-top:32px;background:linear-gradient(180deg,var(--color-warm-red-light),#FDF6F4);border:1px solid var(--color-warm-red-light);border-radius:20px;padding:20px 32px;}
.global-warning-head h3{font-size:15.5px;font-weight:800;color:var(--color-warm-red);}
.global-warning-grid{display:grid;gap:4px 32px;grid-template-columns:1fr;}@media(min-width:640px){.global-warning-grid{grid-template-columns:repeat(2,1fr);}}
.global-warning-grid li{font-size:13px;color:var(--color-text-secondary);line-height:1.65;list-style:none;padding-left:20px;position:relative;}
.global-warning-grid li::before{content:"⚠";position:absolute;left:0;top:0;font-size:12px;color:var(--color-warm-red);}

.meal-section-wrap{padding:0 0 44px;}
.meal-section-title{text-align:center;margin:16px 0 24px;}.meal-section-title h2{font-size:26px;font-weight:900;color:var(--color-text-primary);}
.title-divider{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px;}
.title-divider .divider-line{width:70px;height:2px;background:linear-gradient(90deg,transparent,var(--color-primary),transparent);border-radius:1px;}
.wave-divider{width:100%;max-width:420px;height:22px;margin:0 auto 16px;display:block;opacity:0.45;}
.mode-switcher{display:flex;justify-content:center;margin-bottom:32px;}
.mode-tabs{display:inline-flex;background:var(--color-surface-warm);border-radius:999px;padding:5px;gap:3px;border:1.5px solid var(--color-border);box-shadow:var(--shadow-xs);}
.mode-tab{padding:11px 28px;border-radius:999px;font-size:14px;font-weight:700;color:var(--color-text-secondary);transition:all 0.25s ease;}
.mode-tab.active{background:linear-gradient(135deg,var(--color-primary),#F0B890);color:#fff;box-shadow:0 2px 10px rgba(232,168,124,0.35);}
.daybar-wrap{margin-bottom:32px;}.daybar{display:flex;gap:4px;background:var(--color-surface);border-radius:20px;padding:4px;border:1.5px solid var(--color-border);box-shadow:var(--shadow-xs);overflow-x:auto;scrollbar-width:none;}
.daytab{flex:1 0 auto;min-width:66px;padding:11px 14px;border-radius:14px;text-align:center;color:var(--color-text-secondary);font-size:13px;font-weight:700;transition:all 0.25s ease;}
.daytab.active{background:linear-gradient(135deg,var(--color-primary),#F0B890);color:#fff;}

.summary-bar{background:linear-gradient(180deg,var(--color-surface),var(--color-surface-warm));border:1.5px solid var(--color-border);border-radius:20px;padding:16px 24px;box-shadow:var(--shadow-sm);margin-bottom:32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.summary-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;}
.summary-chip.early{background:var(--grad-breakfast);color:#9B7D00;}.summary-chip.noon{background:var(--grad-lunch);color:#C47844;}
.summary-chip.night{background:var(--grad-dinner);color:#4A7C3A;}.summary-chip.soup{background:var(--grad-soup);color:#7B5E9E;}
.summary-chip b{font-size:17px;font-weight:900;}

.meal-block{margin-bottom:32px;border:1.5px solid var(--color-border);border-radius:26px;background:linear-gradient(180deg,var(--color-surface),var(--color-surface-warm));overflow:hidden;box-shadow:var(--shadow-xs);}
.meal-block.collapsed .meal-body{display:none;}
.meal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;background:linear-gradient(180deg,rgba(232,168,124,0.06),transparent);border-bottom:1px solid var(--color-border);flex-wrap:wrap;}
.meal-head-left{display:flex;align-items:center;gap:12px;}
.meal-badge{display:inline-flex;align-items:center;gap:7px;padding:9px 20px;border-radius:999px;font-size:14.5px;font-weight:800;}
.meal-badge.early{background:var(--grad-breakfast);color:#9B7D00;}.meal-badge.noon{background:var(--grad-lunch);color:#C47844;}
.meal-badge.night{background:var(--grad-dinner);color:#4A7C3A;}.meal-badge.soup{background:var(--grad-soup);color:#7B5E9E;}
.meal-title{font-size:13px;color:var(--color-text-tertiary);font-weight:500;}
.plate-count{font-size:13px;font-weight:700;color:var(--color-text-secondary);}.plate-count b{color:var(--color-primary);font-size:17px;}
.meal-toggle{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:all 0.15s ease;background:var(--color-surface);border:1.5px solid var(--color-border);color:var(--color-text-tertiary);flex-shrink:0;cursor:pointer;}
.meal-toggle:hover{background:var(--color-primary-light);border-color:var(--color-primary);color:var(--color-primary);}
.meal-block.collapsed .meal-toggle svg{transform:rotate(-90deg);}
.meal-toggle svg{width:16px;height:16px;transition:transform 0.25s ease;fill:currentColor;}
.meal-body{padding:20px;}

.plate{position:relative;background:var(--color-surface);border-radius:20px;padding:16px 24px;border:2px dashed var(--color-border-strong);margin-bottom:16px;min-height:68px;transition:all 0.25s ease;overflow:hidden;}
.plate.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;}
.plate.empty::before{content:"🥕 🍅 🥦 🍳 🥬";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;opacity:0.06;letter-spacing:14px;white-space:nowrap;pointer-events:none;}
.plate.empty .empty-icon{font-size:30px;opacity:0.45;position:relative;z-index:1;}
.plate.empty .empty-text{font-size:13px;color:var(--color-text-tertiary);position:relative;z-index:1;}
.plate-chips{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1;}
.plate-chip{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#fff,var(--color-primary-light));border:1.5px solid var(--color-primary);border-radius:999px;padding:7px 10px 7px 14px;font-size:14px;font-weight:700;color:var(--color-text-primary);box-shadow:var(--shadow-xs);animation:chipPopIn 0.45s cubic-bezier(0.34,1.56,0.64,1);}
.plate-chip .pc-emoji{font-size:18px;}.plate-chip .pc-cat{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--color-surface-warm);color:var(--color-text-secondary);}
.plate-chip .pc-remove{width:22px;height:22px;border-radius:50%;background:var(--color-warm-red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;transition:all 0.15s ease;flex-shrink:0;margin-left:2px;cursor:pointer;}
.plate-chip .pc-remove:hover{background:#C84A3A;transform:scale(1.15);}
@keyframes chipPopIn{0%{transform:scale(0.55);opacity:0;}60%{transform:scale(1.06);}100%{transform:scale(1);opacity:1;}}

.add-dish-row{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:16px;border-top:1.5px dashed var(--color-border);}
.add-dish-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:700;color:var(--color-primary);background:linear-gradient(135deg,var(--color-primary-light),#fff);border:2px dashed var(--color-primary);transition:all 0.25s ease;cursor:pointer;}
.add-dish-btn:hover{background:linear-gradient(135deg,var(--color-primary),#F0B890);color:#fff;border-style:solid;box-shadow:var(--shadow-warm-sm);transform:translateY(-1px);}
.add-dish-input{flex:1;min-width:0;padding:8px 14px;border:2px solid var(--color-primary);border-radius:999px;font-size:13px;font-weight:600;color:var(--color-text-primary);background:#fff;outline:none;transition:all 0.15s ease;display:none;font-family:inherit;}
.add-dish-input.show{display:block;}.add-dish-input:focus{border-color:var(--color-primary-dark);box-shadow:0 0 0 3px rgba(232,168,124,0.2);}
.add-dish-confirm{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;background:linear-gradient(135deg,var(--color-primary),#F0B890);color:#fff;display:none;cursor:pointer;white-space:nowrap;}
.add-dish-confirm.show{display:inline-flex;}.add-dish-confirm:hover{background:linear-gradient(135deg,var(--color-primary-hover),#E8A87C);}
.add-dish-cancel{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;background:transparent;color:var(--color-text-secondary);border:2px solid var(--color-border);display:inline-flex;cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.add-dish-cancel:hover{background:#f5f0ed;border-color:var(--color-text-secondary);color:var(--color-text-primary);}

/* ===== Emoji Picker for Custom Dish ===== */
.emoji-picker{display:none;margin-top:12px;padding:14px;border-radius:14px;background:#FFFBF7;border:2px solid var(--color-border);box-shadow:var(--shadow-warm-sm);}
.emoji-picker.show{display:block;animation:fadeSlideIn 0.3s ease;}
.emoji-picker-label{font-size:12px;font-weight:700;color:var(--color-text-secondary);margin-bottom:8px;display:flex;align-items:center;gap:4px;}
.emoji-picker-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.emoji-picker-item{width:34px;height:34px;font-size:20px;border-radius:8px;border:1.5px solid transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s ease;background:#fff;}
.emoji-picker-item:hover{transform:scale(1.2);background:var(--color-primary-light);border-color:var(--color-primary);}
.emoji-picker-item.selected{background:linear-gradient(135deg,var(--color-primary),#F0B890);border-color:var(--color-primary-dark);transform:scale(1.15);box-shadow:0 2px 8px rgba(232,168,124,0.35);}

.candidates-label{font-size:12.5px;font-weight:700;color:var(--color-text-tertiary);margin-bottom:12px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:0.03em;}
.dish-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));}@media(min-width:1024px){.dish-grid{grid-template-columns:repeat(4,1fr);}}
.dish-card{position:relative;background:var(--color-surface);border:1.5px solid var(--color-border);border-radius:20px;padding:16px;box-shadow:var(--shadow-xs);transition:all 0.25s ease;display:flex;flex-direction:column;gap:4px;text-align:left;overflow:hidden;cursor:pointer;}
.dish-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--color-primary);}
.dish-card.selected{background:linear-gradient(180deg,var(--color-primary-light),#fff);border:2.5px solid var(--color-primary);box-shadow:var(--shadow-warm);padding:15px;border-left:5px solid var(--color-primary);}
.dish-card .dc-top{display:flex;align-items:center;gap:8px;}
.dish-emoji-box{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,var(--color-surface-warm),var(--color-accent-light));display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;box-shadow:var(--shadow-xs);transition:all 0.25s ease;}
.dish-card:hover .dish-emoji-box{transform:scale(1.08) rotate(-3deg);}
.dish-card.selected .dish-emoji-box{background:linear-gradient(145deg,var(--color-primary),#F0B890);}
.dish-name{font-size:14.5px;font-weight:700;line-height:1.3;color:var(--color-text-primary);}
.dish-tags{display:flex;flex-wrap:wrap;gap:4px;}
.tag-nutri{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;}
.tag-nutri[data-cat="蛋白质"]{background:var(--color-warm-red-light);color:var(--color-warm-red);}
.tag-nutri[data-cat="谷类"]{background:#FEF8E0;color:#9B7D00;}
.tag-nutri[data-cat="蔬菜"]{background:var(--color-secondary-light);color:#5A9A5A;}
.tag-nutri[data-cat="水果"]{background:#FFE9F0;color:#C44A7A;}
.tag-nutri[data-cat="奶类"]{background:var(--color-lavender-light);color:#8A7AA0;}
.tag-nutri[data-cat="自定义"]{background:#E8E0F5;color:#6A5A9A;}
.dish-desc{font-size:10.5px;color:var(--color-text-tertiary);line-height:1.4;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;padding:0 2px;font-weight:400;opacity:0.85;}
.dish-card .dc-check{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--color-primary);color:#fff;font-size:13px;font-weight:900;display:none;align-items:center;justify-content:center;}
.dish-card.selected .dc-check{display:flex;animation:chipPopIn 0.45s cubic-bezier(0.34,1.56,0.64,1);}
.dish-card .dc-del{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;background:#D0CCC8;color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer;transition:all 0.2s ease;}
.dish-card.selected .dc-del{background:var(--color-warm-red);animation:chipPopIn 0.45s cubic-bezier(0.34,1.56,0.64,1);}
.dish-card .dc-del:hover,.dish-card.selected .dc-del:hover{background:#C84A3A;transform:scale(1.15);}

.no-meals-box{text-align:center;padding:40px 0 60px;}
.no-meals-inner{background:linear-gradient(180deg,var(--color-lavender-light),var(--color-surface));border-radius:26px;padding:36px 28px;max-width:560px;margin:0 auto;box-shadow:var(--shadow-sm);border:1px solid var(--color-border);}
.no-meals-inner .emoji{font-size:52px;margin-bottom:16px;display:block;}.no-meals-inner h3{font-size:19px;font-weight:800;color:var(--color-text-primary);}
.no-meals-inner p{font-size:14px;color:var(--color-text-secondary);line-height:1.65;}

.export-meal-label{display:inline-flex;align-items:center;gap:7px;padding:7px 16px;border-radius:999px;font-size:14px;font-weight:800;margin-bottom:10px;}
.export-meal-label.early{background:var(--grad-breakfast);color:#9B7D00;}.export-meal-label.noon{background:var(--grad-lunch);color:#C47844;}
.export-meal-label.night{background:var(--grad-dinner);color:#4A7C3A;}.export-meal-label.soup{background:var(--grad-soup);color:#7B5E9E;}
.export-dish-list{display:flex;flex-wrap:wrap;gap:8px;padding-left:8px;}
.export-dish{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--color-border);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:700;color:var(--color-text-primary);}
.export-empty{font-size:13px;color:var(--color-text-tertiary);padding-left:8px;font-style:italic;}
.export-day-sep{height:1px;background:var(--color-border);margin:22px 0;}
.export-day-label{font-size:17px;font-weight:900;color:var(--color-primary);margin-bottom:14px;padding-bottom:6px;border-bottom:2px solid var(--color-primary-light);}
.export-footer{margin-top:24px;padding-top:14px;border-top:1.5px dashed var(--color-border);font-size:11px;color:var(--color-text-tertiary);text-align:center;line-height:1.7;}
.wave-sep{width:100%;height:34px;overflow:hidden;margin-top:32px;}.wave-sep svg{width:100%;height:100%;display:block;}
.app-footer{background:linear-gradient(180deg,var(--color-surface-warm),var(--color-surface));border-top:1.5px solid var(--color-border);padding:24px 0;}
.disclaimer{max-width:760px;margin:0 auto;text-align:center;font-size:12px;color:var(--color-text-secondary);line-height:1.75;}
.disc-title{font-weight:800;color:var(--color-text-primary);font-size:13px;}.disc-source{color:var(--color-text-tertiary);font-size:11px;margin-top:4px;}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(24px);background:var(--color-text-primary);color:#fff;padding:13px 24px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:var(--shadow-lg);z-index:400;opacity:0;pointer-events:none;transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.img-preview-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s;}
.img-preview-overlay .preview-tip{color:#fff;font-size:14px;margin-bottom:12px;text-align:center;line-height:1.6;}
.img-preview-overlay .preview-tip b{color:#FFE066;}
.img-preview-overlay img{max-width:100%;max-height:75vh;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,.4);}
.img-preview-overlay .preview-actions{margin-top:14px;display:flex;gap:10px;}
.img-preview-overlay .preview-actions button{padding:10px 20px;border-radius:999px;font-size:14px;font-weight:700;border:none;cursor:pointer;}
.img-preview-overlay .btn-close{background:#555;color:#fff;}
.img-preview-overlay .btn-share{background:var(--color-accent);color:#fff;}
.img-preview-overlay .btn-download{background:#4CAF50;color:#fff;}
@media(max-width:639px){
  .brand-text p{display:none;}.diet-hero h2{font-size:23px;}.dish-grid{grid-template-columns:repeat(2,1fr);}
  .daytab{min-width:54px;padding:9px 8px;font-size:12px;}.summary-bar{flex-direction:column;align-items:stretch;}
  .nav-item{padding:8px 13px;font-size:12.5px;}.add-dish-row{flex-direction:column;}.add-dish-input{width:100%;}
}
@media(min-width:640px) and (max-width:1023px){.dish-grid{grid-template-columns:repeat(3,1fr);}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}}
button:focus-visible,.nav-item:focus-visible,.mode-tab:focus-visible,.daytab:focus-visible,.dish-card:focus-visible,.add-dish-btn:focus-visible{outline:3px solid var(--color-primary);outline-offset:2px;}

/* Hide note bar for 0-6 month babies */
[data-age="page-0-6"] .note-bar-wrap { display: none !important; }

};/* ===== 状态管理 ===== */
const state={currentPage:'page-0-6',mode:'single',currentDay:'mon',selections:{},collapsed:{},removedDishes:{},selectedEmoji:{}};
function initSelections(){
  AGE_PAGES.forEach(p=>{
    if(!p.hasMeals)return;
    state.selections[p.id]={single:{breakfast:[],lunch:[],dinner:[],soup:[]},custom:{breakfast:[],lunch:[],dinner:[],soup:[]}};
    state.selections[p.id].weekly={};
    DAY_KEYS.forEach(d=>{state.selections[p.id].weekly[d]={breakfast:[],lunch:[],dinner:[],soup:[],custom:{breakfast:[],lunch:[],dinner:[],soup:[]}};});
    state.collapsed[p.id]={breakfast:false,lunch:false,dinner:false,soup:false};
    state.removedDishes[p.id]={breakfast:new Set(),lunch:new Set(),dinner:new Set(),soup:new Set()};
  });
}
initSelections();

/* ===== localStorage 持久化 ===== */
const DISH_STATE_KEY='meal-planner-dish-state';
function saveDishState(){
  try{
    const data={removedDishes:{},selections:{},collapsed:{}};
    Object.keys(state.removedDishes).forEach(pid=>{
      data.removedDishes[pid]={};
      MEAL_KEYS.forEach(m=>{data.removedDishes[pid][m]=Array.from(state.removedDishes[pid][m]);});
    });
    Object.keys(state.selections).forEach(pid=>{
      const pg=state.selections[pid];
      data.selections[pid]={
        single:pg.single,
        custom:pg.custom.map?pg.custom:JSON.parse(JSON.stringify(pg.custom)),
        weekly:{}
      };
      Object.keys(pg.weekly).forEach(d=>{
        data.selections[pid].weekly[d]={
          breakfast:pg.weekly[d].breakfast,
          lunch:pg.weekly[d].lunch,
          dinner:pg.weekly[d].dinner,
          soup:pg.weekly[d].soup,
          custom:JSON.parse(JSON.stringify(pg.weekly[d].custom))
        };
      });
    });
    Object.keys(state.collapsed).forEach(pid=>{
      if(!data.collapsed[pid])data.collapsed[pid]={};
      MEAL_KEYS.forEach(m=>{data.collapsed[pid][m]=!!state.collapsed[pid][m];});
    });
    localStorage.setItem(DISH_STATE_KEY,JSON.stringify(data));
  }catch(e){}
}
function loadDishState(){
  try{
    const raw=localStorage.getItem(DISH_STATE_KEY);
    if(!raw)return;
    const data=JSON.parse(raw);
    if(data.removedDishes){
      Object.keys(data.removedDishes).forEach(pid=>{
        if(!state.removedDishes[pid])state.removedDishes[pid]={breakfast:new Set(),lunch:new Set(),dinner:new Set(),soup:new Set()};
        MEAL_KEYS.forEach(m=>{
          if(data.removedDishes[pid][m])state.removedDishes[pid][m]=new Set(data.removedDishes[pid][m]);
        });
      });
    }
    if(data.selections){
      Object.keys(data.selections).forEach(pid=>{
        const saved=data.selections[pid];
        const pg=state.selections[pid];if(!pg)return;
        MEAL_KEYS.forEach(m=>{pg.single[m]=saved.single[m]||[];});
        // custom: restore custom dish objects
        MEAL_KEYS.forEach(m=>{pg.custom[m]=saved.custom[m]||[];});
        if(saved.weekly){
          Object.keys(saved.weekly).forEach(d=>{
            if(pg.weekly[d]){
              MEAL_KEYS.forEach(m=>{pg.weekly[d][m]=saved.weekly[d][m]||[];});
              pg.weekly[d].custom=JSON.parse(JSON.stringify(saved.weekly[d].custom||{breakfast:[],lunch:[],dinner:[],soup:[]}));
            }
          });
        }
      });
    }
    // restore collapsed state
    if(data.collapsed){
      Object.keys(data.collapsed).forEach(pid=>{
        if(!state.collapsed[pid])state.collapsed[pid]={breakfast:false,lunch:false,dinner:false,soup:false};
        MEAL_KEYS.forEach(m=>{
          if(typeof data.collapsed[pid][m]==='boolean')state.collapsed[pid][m]=data.collapsed[pid][m];
        });
      });
    }
  }catch(e){}
}
loadDishState();

function getDish(pageId,meal,dishId){
  const data=DISH_DATA[pageId];if(!data||!data[meal])return null;
  const found=data[meal].find(d=>d.id===dishId);
  if(found)return found;
  const pg=state.selections[pageId];if(!pg)return null;
  const customSrc=state.mode==='single'?pg.custom:pg.weekly[state.currentDay]?.custom;
  if(customSrc&&customSrc[meal])return customSrc[meal].find(d=>d.id===dishId);
  return null;
}
function getCurrentSelections(pageId){
  const pid=pageId||state.currentPage;
  const pg=state.selections[pid];if(!pg)return null;
  const base=state.mode==='single'?pg.single:pg.weekly[state.currentDay];
  const customSrc=state.mode==='single'?pg.custom:pg.weekly[state.currentDay]?.custom;
  const merged={breakfast:[...base.breakfast],lunch:[...base.lunch],dinner:[...base.dinner],soup:[...base.soup]};
  if(customSrc){
    Object.keys(customSrc).forEach(k=>{if(merged[k])merged[k]=merged[k].concat(customSrc[k]);});
  }
  return merged;
}
function getDaySelections(pageId,dayIndex){
  const pg=state.selections[pageId];if(!pg)return null;
  const dayKey=DAY_KEYS[dayIndex]||DAY_KEYS[0];
  const base=pg.weekly[dayKey];
  if(!base)return null;
  const customSrc=pg.weekly[dayKey]?.custom;
  const merged={breakfast:[...base.breakfast],lunch:[...base.lunch],dinner:[...base.dinner],soup:[...base.soup]};
  if(customSrc){Object.keys(customSrc).forEach(k=>{if(merged[k])merged[k]=merged[k].concat(customSrc[k]);});}
  return merged;
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1800);}

function renderNav(){
  const nav=document.getElementById('age-nav');nav.innerHTML='';
  AGE_PAGES.forEach(p=>{const b=document.createElement('button');b.className='nav-item'+(p.id===state.currentPage?' active':'');b.textContent=p.label;b.dataset.page=p.id;b.setAttribute('role','tab');b.addEventListener('click',()=>switchPage(p.id));nav.appendChild(b);});
}

function renderPage(page){
  let h='<div class="age-page'+(page.id===state.currentPage?' active':'')+'" id="'+page.id+'">';
  if(page.hasMeals){h+='<div class="meal-nav-wrap show"><div class="meal-nav">'+renderMealNav(page.id)+'</div></div>';}
  h+='<section class="container diet-section">';
  h+='<div class="diet-hero"><img src="'+IMAGE_DATA[page.id]+'" class="diet-hero-icon" alt="'+page.label+'配图" /><h2>'+page.heroTitle+'</h2><p>'+page.heroDesc+'</p></div>';
  h+='<div class="diet-grid">';
  page.dietCards.forEach(c=>{h+='<div class="diet-card'+(c.type==='danger'?' danger':'')+(c.type==='tip'?' tip':'')+'">';
    h+='<div class="diet-card-head"><div class="diet-card-icon '+c.type+' emoji">'+c.icon+'</div><h3>'+c.title+'</h3></div><ul>';
    c.items.forEach(it=>{h+='<li>'+it+'</li>';});h+='</ul></div>';});
  h+='</div><div class="global-warning"><div class="global-warning-head"><h3>⚠️ 全年龄段通用红线</h3></div><ul class="global-warning-grid">';
  GLOBAL_WARNINGS.forEach(w=>{h+='<li>'+w+'</li>';});h+='</ul></div></section>';
  h+='<div class="note-bar-wrap"><div class="note-bar"><span class="note-label">宝宝备注</span><input class="note-input" type="text" placeholder="输入宝宝名字或备注..." maxlength="20" data-note-for="'+page.id+'"/></div></div>';
if(page.hasMeals){h+=renderMealSection(page);}
  else{h+='<section class="container no-meals-box"><div class="no-meals-inner"><span class="emoji">🍼</span><h3>本阶段无需餐谱规划</h3><p>0-6月龄以纯母乳或配方奶为唯一食物，无需添加辅食。请遵循上方膳食特点中的喂养建议。</p></div></section>';}
  h+='</div>';return h;
}

function renderMealSection(page){
  let h='<section class="meal-section-wrap"><div class="container">';
  h+='<div class="meal-section-title"><h2>餐谱规划</h2>';
  h+='<div class="title-divider"><span class="divider-line"></span><span class="divider-icon emoji">🥣</span><span class="divider-line"></span></div><p>自由勾选候选菜品，不限数量，支持单日/整周双模式</p></div>';
  h+='<svg class="wave-divider" viewBox="0 0 420 22"><path d="M0,11 Q52.5,1 105,11 T210,11 T315,11 T420,11" fill="none" stroke="#E8A87C" stroke-width="1.5" opacity="0.35"/></svg>';
  h+='<div class="mode-switcher"><div class="mode-tabs" id="mode-tabs-'+page.id+'">';
  h+='<button class="mode-tab'+(state.mode==='single'?' active':'')+'" data-mode="single">单日</button>';
  h+='<button class="mode-tab'+(state.mode==='weekly'?' active':'')+'" data-mode="weekly">整周</button></div></div>';
  if(state.mode==='weekly'){h+='<div class="daybar-wrap"><div class="daybar" id="daybar-'+page.id+'">';
    DAYS.forEach((dn,i)=>{h+='<button class="daytab'+(DAY_KEYS[i]===state.currentDay?' active':'')+'" data-day="'+DAY_KEYS[i]+'">'+dn+'</button>';});
    h+='</div></div>';}
  h+=renderSummaryBar(page.id);
  MEAL_KEYS.forEach(meal=>{h+=renderMealBlock(page.id,meal);});
  h+='</div></section>';return h;
}

function renderSummaryBar(pageId){
  const sel=getCurrentSelections(pageId);if(!sel)return '';
  let h='<div class="summary-bar no-export"><div class="summary-left">';
  MEAL_KEYS.forEach(m=>{const cnt=sel[m].length;h+='<span class="summary-chip '+MEAL_BADGE[m]+'">'+MEAL_NAMES[m]+' <b>'+cnt+'</b></span>';});
  h+='</div><div class="summary-actions">';
  h+='<button class="btn btn-secondary" style="padding:6px 14px;font-size:13px;" id="btn-clear-'+pageId+'">清空'+(state.mode==='weekly'?'当日':'')+'</button>';
  h+='</div></div>';return h;
}

function renderMealNav(pageId){
  const sel=getCurrentSelections(pageId);if(!sel)return '';
  let h='';
  MEAL_KEYS.forEach(m=>{
    const cnt=sel[m].length;
    h+='<button class="meal-nav-btn '+MEAL_BADGE[m]+'" data-scroll-to="'+m+'" data-page="'+pageId+'">';
    h+='<span class="meal-nav-badge">'+(cnt||'0')+'</span>'+MEAL_ICON[m]+' '+MEAL_NAMES[m];
    h+='</button>';
  });
  return h;
}

function renderMealBlock(pageId,meal){
  if(!DISH_DATA[pageId]||!DISH_DATA[pageId][meal])return '';
  const sel=getCurrentSelections(pageId);if(!sel)return '';
  const selected=sel[meal];
  const dishes=DISH_DATA[pageId][meal].filter(d=>!state.removedDishes[pageId]?.[meal]?.has(d.id));
  const isCollapsed=state.collapsed[pageId]?.[meal];
  const pg=state.selections[pageId];
  const customSrc=state.mode==='single'?pg.custom:pg.weekly[state.currentDay]?.custom;
  const customDishes=customSrc?.[meal]||[];

  let h='<div class="meal-block'+(isCollapsed?' collapsed':'')+'" data-meal="'+meal+'" data-page="'+pageId+'" id="meal-'+meal+'">';
  h+='<div class="meal-head"><div class="meal-head-left">';
  h+='<span class="meal-badge '+MEAL_BADGE[meal]+'"><span class="emoji">'+MEAL_ICON[meal]+'</span>'+MEAL_NAMES[meal]+'</span>';
  h+='<span class="meal-title">'+MEAL_SUBTITLE[meal]+'</span></div>';
  h+='<span class="plate-count">已选 <b>'+selected.length+'</b> 道</span>';
  h+='<button class="meal-toggle" aria-label="收起/展开"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></button></div>';
  h+='<div class="meal-body">';
  if(selected.length===0){
    h+='<div class="plate empty"><div class="empty-icon emoji">🍽️</div><div class="empty-text">点击下方菜品，加入'+MEAL_NAMES[meal]+'</div></div>';
  }else{
    h+='<div class="plate"><div class="plate-chips">';
    selected.forEach(id=>{
      const d=getDish(pageId,meal,id);if(!d)return;
      const isCustom=id.startsWith('custom_');
      h+='<span class="plate-chip"><span class="pc-emoji emoji">'+d.emoji+'</span>'+d.name+
        '<span class="pc-cat">'+d.category+(isCustom?'·自定义':'')+'</span>'+
        '<button class="pc-remove" data-page="'+pageId+'" data-meal="'+meal+'" data-dish="'+id+'" aria-label="移除">✕</button></span>';
    });
    h+='</div></div>';
  }
  h+='<div class="add-dish-row"><button class="add-dish-btn" data-page="'+pageId+'" data-meal="'+meal+'">➕ 自定义添加菜品</button>';
  h+='<div style="display:none;width:100%;" class="add-dish-form">';
  h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">';
  h+='<input class="add-dish-input show" placeholder="输入菜品名称后确认..." data-page="'+pageId+'" data-meal="'+meal+'" style="display:block;flex:1;">';
  h+='<button class="add-dish-confirm show" data-page="'+pageId+'" data-meal="'+meal+'">✓ 添加</button>';
  h+='<button class="add-dish-cancel" data-page="'+pageId+'" data-meal="'+meal+'">✕ 取消</button></div>';
  h+='<div class="emoji-picker show" data-page="'+pageId+'" data-picker-for="'+meal+'">';
  h+='<div class="emoji-picker-label">🎨 选择图标</div>';
  h+='<div class="emoji-picker-grid" id="ep-grid-'+pageId+'-'+meal+'"></div>';
  h+='</div></div></div>';
  h+='<div class="candidates-label"><span class="emoji">👉</span> 候选菜品（点击选择/取消）</div>';
  h+='<div class="dish-grid">';
  dishes.forEach(d=>{
    const isSel=selected.includes(d.id);
    h+='<button class="dish-card'+(isSel?' selected':'')+'" data-page="'+pageId+'" data-meal="'+meal+'" data-dish="'+d.id+'">';
    h+='<div class="dc-del" data-page="'+pageId+'" data-meal="'+meal+'" data-dish="'+d.id+'">✕</div>';
    h+='<div class="dc-check">✓</div><div class="dc-top"><div class="dish-emoji-box emoji">'+d.emoji+'</div><div class="dish-name">'+d.name+'</div></div>';
    h+='<div class="dish-tags"><span class="tag-nutri" data-cat="'+d.category+'">'+d.category+'</span></div>';
    h+='<div class="dish-desc">'+d.desc+'</div></button>';
  });
  customDishes.forEach(d=>{
    const isSel=selected.includes(d.id);
    h+='<button class="dish-card'+(isSel?' selected':'')+'" data-page="'+pageId+'" data-meal="'+meal+'" data-dish="'+d.id+'" data-custom="1">';
    h+='<div class="dc-del" data-page="'+pageId+'" data-meal="'+meal+'" data-dish="'+d.id+'">✕</div>';
    h+='<div class="dc-check">✓</div><div class="dc-top"><div class="dish-emoji-box emoji">'+d.emoji+'</div><div class="dish-name">'+d.name+'</div></div>';

    h+='<div class="dish-desc">'+d.desc+'</div></button>';
  });
  h+='</div></div></div>';return h;
}

/* ===== Sticky Meal Nav ===== */
function updateMealNav(){
  const page=AGE_PAGES.find(p=>p.id===state.currentPage);
  const activePage=document.getElementById(state.currentPage);
  if(!activePage)return;
  const wrap=activePage.querySelector('.meal-nav-wrap');
  const nav=activePage.querySelector('.meal-nav');
  if(!page||!page.hasMeals){if(wrap)wrap.classList.remove('show');return;}
  if(wrap)wrap.classList.add('show');
  if(nav)nav.innerHTML=renderMealNav(state.currentPage);
}
function scrollToMeal(meal){
  const el=document.getElementById('meal-'+meal);
  if(el){el.scrollIntoView({behavior:'smooth',block:'start'});}
}

function adjustStickyTops(){
  const header=document.querySelector('.app-header');
  const ageNav=document.querySelector('.age-nav-wrap');
  const mealNavs=document.querySelectorAll('.meal-nav-wrap');
  if(header&&ageNav){
    ageNav.style.top=header.offsetHeight+'px';
  }
  if(header&&ageNav){
    const top=header.offsetHeight+ageNav.offsetHeight;
    mealNavs.forEach(nav=>{nav.style.top=top+'px';});
  }
}

/* ===== Core Functions ===== */
function renderAllPages(){const main=document.getElementById('app-main');main.innerHTML='';AGE_PAGES.forEach(p=>{main.insertAdjacentHTML('beforeend',renderPage(p));});bindEvents();updateMealNav();}
function switchPage(pageId){state.currentPage=pageId;document.body.setAttribute('data-age',pageId);document.querySelectorAll('.age-page').forEach(p=>p.classList.remove('active'));document.getElementById(pageId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===pageId));
  updateMealNav();
  adjustStickyTops();
  window.scrollTo({top:0,behavior:'smooth'});}
function switchMode(mode){state.mode=mode;rerenderCurrentPage();}
function switchDay(dayKey){state.currentDay=dayKey;rerenderCurrentPage();}
function rerenderCurrentPage(){const page=AGE_PAGES.find(p=>p.id===state.currentPage);if(!page)return;const oldEl=document.getElementById(page.id);const tmp=document.createElement('div');tmp.innerHTML=renderPage(page);oldEl.parentNode.replaceChild(tmp.firstElementChild,oldEl);bindEvents();updateMealNav();saveDishState();adjustStickyTops();}
function toggleCollapse(pageId,meal){if(!state.collapsed[pageId])return;state.collapsed[pageId][meal]=!state.collapsed[pageId][meal];rerenderCurrentPage();}

function toggleDish(pageId,meal,dishId){
  const pg=state.selections[pageId];if(!pg)return;
  const base=state.mode==='single'?pg.single:pg.weekly[state.currentDay];
  const arr=base[meal];const idx=arr.indexOf(dishId);
  if(idx>=0){arr.splice(idx,1);}else{arr.push(dishId);}
  rerenderCurrentPage();
}
function deleteOriginalDish(pageId,meal,dishId){
  if(!state.removedDishes[pageId])state.removedDishes[pageId]={breakfast:new Set(),lunch:new Set(),dinner:new Set(),soup:new Set()};
  state.removedDishes[pageId][meal].add(dishId);
  const pg=state.selections[pageId];if(!pg)return;
  const base=state.mode==='single'?pg.single:pg.weekly[state.currentDay];
  const idx=base[meal].indexOf(dishId);
  if(idx>=0)base[meal].splice(idx,1);
  showToast('已删除菜品');rerenderCurrentPage();
}
function handleDishDelete(pageId,meal,dishId){
  const pg=state.selections[pageId];if(!pg)return;
  const base=state.mode==='single'?pg.single:pg.weekly[state.currentDay];
  const isSelected=base[meal].includes(dishId);
  if(isSelected){removeDishDirect(pageId,meal,dishId);}
  else{deleteOriginalDish(pageId,meal,dishId);}
}
function removeDishDirect(pageId,meal,dishId){
  const pg=state.selections[pageId];if(!pg)return;
  const base=state.mode==='single'?pg.single:pg.weekly[state.currentDay];
  const arr=base[meal];const idx=arr.indexOf(dishId);
  if(idx>=0){arr.splice(idx,1);}
  if(dishId.startsWith('custom_')){
    const customArr=state.mode==='single'?pg.custom[meal]:pg.weekly[state.currentDay].custom[meal];
    const ci=customArr.findIndex(d=>d.id===dishId);
    if(ci>=0)customArr.splice(ci,1);
  }
  rerenderCurrentPage();
}
function clearCurrent(){
  const pid=state.currentPage;
  const pg=state.selections[pid];if(!pg)return;
  if(state.mode==='single'){
    MEAL_KEYS.forEach(m=>{pg.single[m]=[];pg.custom[m]=[];});
  }else{
    const day=pg.weekly[state.currentDay];if(!day)return;
    MEAL_KEYS.forEach(m=>{day[m]=[];day.custom[m]=[];});
  }
  saveDishState();
  rerenderCurrentPage();
  showToast('已清空菜单');
}
function resetRemovedDishes(pageId){
  if(!state.removedDishes[pageId])return;
  MEAL_KEYS.forEach(m=>{state.removedDishes[pageId][m]=new Set();});
  rerenderCurrentPage();showToast('已恢复默认菜品');
}

function showAddInput(btn){const row=btn.closest('.add-dish-row');const form=row.querySelector('.add-dish-form');form.style.display='block';const pageId=btn.dataset.page;const meal=btn.dataset.meal;const key=pageId+'_'+meal;state.selectedEmoji[key]='🍽️';const grid=document.getElementById('ep-grid-'+pageId+'-'+meal);if(grid){grid.innerHTML='';EMOJI_CATEGORIES.forEach(cat=>{cat.icons.forEach(em=>{const el=document.createElement('span');el.className='emoji-picker-item';el.textContent=el.dataset.emoji=em;el.addEventListener('click',()=>pickEmoji(el,key));grid.appendChild(el);});});}row.querySelector('.add-dish-input').focus();btn.style.display='none';}
function pickEmoji(emojiEl,key){const em=emojiEl.dataset.emoji;state.selectedEmoji[key]=em;emojiEl.parentElement.querySelectorAll('.emoji-picker-item').forEach(e=>e.classList.remove('selected'));emojiEl.classList.add('selected');}
function confirmAddDish(input){const name=input.value.trim();if(!name){showToast('请输入菜品名称');return;}
  const pageId=input.dataset.page;const meal=input.dataset.meal;
  const pg=state.selections[pageId];if(!pg)return;
  const dishId='custom_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  const key=pageId+'_'+meal;
  const chosenEmoji=(state.selectedEmoji&&state.selectedEmoji[key])?state.selectedEmoji[key]:'🍽️';
  const customObj={id:dishId,name:name,emoji:chosenEmoji,category:'自定义',desc:'用户自定义添加的菜品'};
  if(state.mode==='single'){pg.custom[meal].push(customObj);pg.single[meal].push(dishId);}
  else{pg.weekly[state.currentDay].custom[meal].push(customObj);pg.weekly[state.currentDay][meal].push(dishId);}
  showToast('已添加：'+name);rerenderCurrentPage();
}
function cancelAddDish(btn){const form=btn.closest('.add-dish-form');const row=form.closest('.add-dish-row');form.style.display='none';row.querySelector('.add-dish-input').value='';const addBtn=row.querySelector('.add-dish-btn');if(addBtn)addBtn.style.display='';}

/* ===== Events ===== */
function bindEvents(){
  document.querySelectorAll('.mode-tab').forEach(t=>{t.addEventListener('click',()=>switchMode(t.dataset.mode));});
  document.querySelectorAll('.daytab').forEach(t=>{t.addEventListener('click',()=>switchDay(t.dataset.day));});
  document.querySelectorAll('.dish-card').forEach(c=>{c.addEventListener('click',(e)=>{
    if(e.target.classList.contains('dc-del'))return;
    toggleDish(c.dataset.page,c.dataset.meal,c.dataset.dish);
  });});
  document.querySelectorAll('.dc-del').forEach(b=>{b.addEventListener('click',(e)=>{e.stopPropagation();handleDishDelete(b.dataset.page,b.dataset.meal,b.dataset.dish);});});
  document.querySelectorAll('.pc-remove').forEach(b=>{b.addEventListener('click',(e)=>{e.stopPropagation();removeDishDirect(b.dataset.page,b.dataset.meal,b.dataset.dish);});});
  document.querySelectorAll('[id^="btn-clear-"]').forEach(b=>{b.addEventListener('click',clearCurrent);});
  document.querySelectorAll('.meal-toggle').forEach(b=>{b.addEventListener('click',()=>{
    const block=b.closest('.meal-block');toggleCollapse(block.dataset.page,block.dataset.meal);
  });});
  document.querySelectorAll('.add-dish-btn').forEach(b=>{b.addEventListener('click',()=>showAddInput(b));});
  document.querySelectorAll('.add-dish-confirm').forEach(b=>{b.addEventListener('click',()=>confirmAddDish(b.parentElement.querySelector('.add-dish-input')));});
  document.querySelectorAll('.add-dish-cancel').forEach(b=>{b.addEventListener('click',()=>cancelAddDish(b));});
  document.querySelectorAll('.add-dish-input').forEach(i=>{i.addEventListener('keydown',(e)=>{if(e.key==='Enter')confirmAddDish(i);if(e.key==='Escape')cancelAddDish(i.parentElement.querySelector('.add-dish-cancel'));});});
  // meal nav clicks
  document.querySelectorAll('.meal-nav-btn').forEach(b=>{b.addEventListener('click',()=>scrollToMeal(b.dataset.scrollTo));});
initNotes();}

/* ===== Export — Fixed: use visible temp container ===== */
function exportScreenshot(){
  const page=AGE_PAGES.find(p=>p.id===state.currentPage);
  if(!page||!page.hasMeals){showToast('当前页面无餐谱可导出');return;}
  if(typeof html2canvas==='undefined'){showToast('截图库加载失败，请检查网络');return;}
  const sel=getCurrentSelections(page.id);if(!sel){showToast('暂无选择数据');return;}
  showToast('正在生成餐谱图片…');

  const tmpDiv=document.createElement('div');
  const ageBg=getComputedStyle(document.body).getPropertyValue('--color-bg').trim()||'#FFF9F2';
  tmpDiv.style.cssText='position:fixed;top:0;left:0;width:960px;background:'+ageBg+';padding:36px;font-family:var(--font-body);z-index:9999;overflow-y:auto;';

  let eh='<div style="text-align:center;margin-bottom:20px;padding-bottom:14px;border-bottom:3px double '+getComputedStyle(document.documentElement).getPropertyValue('--color-primary').trim()+';">';
  eh+='<h2 style="font-size:24px;font-weight:900;color:#4A3F35;">童趣餐谱 · '+page.label+'</h2>';
  eh+='<p style="font-size:13px;color:#7D7067;">'+(state.mode==='single'?'今日菜单':'整周日程')+' · 菜单详情</p></div>';

  if(state.mode==='single'){
    eh+=buildExportBlocks(page,sel);
  }else{
    // ── Weekly: compact 2/3-column grid instead of vertical stack ──
    eh+='<div class="export-weekly-grid">';
    DAYS.forEach((dn,i)=>{
      eh+='<div class="export-day-card">';
      eh+='<div class="export-day-label">📅 '+dn+'</div>';
      MEAL_KEYS.forEach(meal=>{
        const daySel=getDaySelections(page.id,i);
        if(daySel&&daySel[meal]&&daySel[meal].length>0){
          eh+='<div style="margin-bottom:8px;">';
          eh+='<div class="export-meal-label '+MEAL_BADGE[meal]+'"><span>'+MEAL_ICON[meal]+'</span>'+MEAL_NAMES[meal]+'</div>';
          eh+='<div class="export-dish-list">';
          daySel[meal].forEach(id=>{const d=getDish(page.id,meal,id);if(!d)return;
            eh+='<span class="export-dish"><span>'+d.emoji+'</span>'+d.name+'</span>';});
          eh+='</div></div>';
        }
      });
      eh+='</div>';
    });
    eh+='</div>';
  }
  eh+='<div style="margin-top:24px;padding-top:14px;border-top:1.5px dashed #F0E8DD;font-size:11px;color:#A39585;text-align:center;line-height:1.7;">本餐谱仅供参考，具体营养需求请咨询专业营养师或医生。<br>数据来源：中国居民膳食指南（2022）</div>';

  tmpDiv.innerHTML=eh;
  document.body.appendChild(tmpDiv);

  /* 注入备注标签到导出内容 */
  var noteInput=document.querySelector('.note-input[data-note-for="'+page.id+'"]');
  if(noteInput&&noteInput.value.trim()){
    var badge=document.createElement('div');
    badge.className='note-badge export-note-badge';
    badge.textContent=noteInput.value.trim();
    badge.style.cssText='display:inline-block!important;position:absolute;top:10px;right:16px;background:linear-gradient(135deg,'+getComputedStyle(document.documentElement).getPropertyValue('--color-primary').trim()+',#F0B890);color:#fff;font-size:15px;font-weight:800;padding:7px 20px;border-radius:999px;z-index:20;box-shadow:0 3px 12px rgba(0,0,0,0.15);white-space:nowrap;';
    tmpDiv.style.position='relative';
    tmpDiv.appendChild(badge);
  }


  setTimeout(()=>{
    html2canvas(tmpDiv,{backgroundColor:ageBg,scale:2,useCORS:true,logging:false}).then(canvas=>{
      const fileName='儿童餐谱_'+page.label+'_'+(state.mode==='single'?'单日':'整周')+'.jpg';
      const imgUrl=canvas.toDataURL('image/jpeg',0.92);
      document.body.removeChild(tmpDiv);
      // 弹出图片预览弹窗，用户可长按保存到相册（所有手机通用）
      showImagePreview(imgUrl,fileName,canvas);
    }).catch(err=>{console.error(err);showToast('导出失败，请重试');try{document.body.removeChild(tmpDiv);}catch(e){}});
  },200);
}
function showImagePreview(imgUrl,fileName,canvas){
  const overlay=document.createElement('div');
  overlay.className='img-preview-overlay';
  // 提示文字
  const tip=document.createElement('div');
  tip.className='preview-tip';
  const isMobile=/Mobi|Android|iPhone/i.test(navigator.userAgent);
  tip.innerHTML=isMobile
    ?'<b>长按图片</b> → 保存到相册'
    :'右键图片 → 另存为';
  overlay.appendChild(tip);
  // 图片
  const img=document.createElement('img');
  img.src=imgUrl;
  overlay.appendChild(img);
  // 操作按钮：仅保留一个提示性按钮
  const actions=document.createElement('div');
  actions.className='preview-actions';
  const btnHint=document.createElement('button');
  btnHint.className='btn-download';
  btnHint.textContent='长按保存相册';
  btnHint.onclick=function(){showToast('请长按上方图片保存到相册');};
  actions.appendChild(btnHint);
  overlay.appendChild(actions);
  // 点击背景区域也可关闭
  overlay.addEventListener('click',function(e){
    if(e.target===overlay)document.body.removeChild(overlay);
  });
  document.body.appendChild(overlay);
}

function buildExportBlocks(page,sel){
  let h='';
  MEAL_KEYS.forEach(meal=>{
    h+='<div style="margin-bottom:16px;">';
    h+='<div class="export-meal-label '+MEAL_BADGE[meal]+'"><span>'+MEAL_ICON[meal]+'</span>'+MEAL_NAMES[meal]+'</div>';
    if(sel[meal].length===0){h+='<div style="font-size:13px;color:#A39585;padding-left:8px;font-style:italic;">暂未选择菜品</div>';}
    else{h+='<div class="export-dish-list">';
      sel[meal].forEach(id=>{const d=getDish(page.id,meal,id);if(!d)return;
        h+='<span class="export-dish"><span>'+d.emoji+'</span>'+d.name+'</span>';});
      h+='</div>';}
    h+='</div>';
  });
  return h;
}

/* 备注标签功能 JS */
const NOTE_STORAGE_KEY='meal-planner-notes';
function initNotes(){
  try{
    const saved=localStorage.getItem(NOTE_STORAGE_KEY);
    const notes=saved?JSON.parse(saved):{};
    document.querySelectorAll('.note-input').forEach(function(inp){
      const pid=inp.getAttribute('data-note-for');
      inp.value=(notes&&notes[pid])?notes[pid]:inp.value||'大宝';
      inp.addEventListener('input',saveNotes);
    });
  }catch(e){}
}
function saveNotes(){
  try{
    const notes={};
    document.querySelectorAll('.note-input').forEach(function(inp){
      const val=inp.value.trim();
      if(val)notes[inp.getAttribute('data-note-for')]=val;
    });
    localStorage.setItem(NOTE_STORAGE_KEY,JSON.stringify(notes));
  }catch(e){}
}
function getNoteForPage(pid){
  var el=document.querySelector('[data-note-for="'+pid+'"]');
  return el?el.value.trim():'';
}
